<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Tarjeta de un lugar de carga. "codigo" es PROPIO o CONTRAPARTE: forma los id y la URL del formulario. */-->
<section th:fragment="tarjeta(lugar, codigo)" th:with="rechazado=${lugar.estado.name() == 'RECHAZADO'}"
         th:id="|lugar-${codigo}|" th:aria-labelledby="|titulo-${codigo}|">
    <h2 th:id="|titulo-${codigo}|" th:text="${lugar.etiqueta}">Lugar</h2>

    <div th:switch="${lugar.estado.name()}">
        <p th:case="'VACIO'">Todavía no cargaste un archivo.</p>
        <p th:case="'RECHAZADO'" th:id="|error-${codigo}|" role="alert">
            <strong th:text="${lugar.nombreArchivo}">archivo</strong>
            <span th:text="${lugar.mensajeRechazo}">Motivo del rechazo</span>
        </p>
        <p th:case="'PENDIENTE_DE_HOJA'">
            <strong th:text="${lugar.nombreArchivo}">archivo</strong>: falta elegir la hoja.
        </p>
        <p th:case="'VALIDO'">
            Archivo cargado: <strong th:text="${lugar.nombreArchivo}">archivo</strong>
        </p>
    </div>

    <form method="post" th:action="@{/carga/{codigo}(codigo=${codigo})}" enctype="multipart/form-data"
          th:aria-labelledby="|titulo-${codigo}|">
        <label th:for="|archivo-${codigo}|">
            Archivo de <span th:text="${lugar.etiqueta}">lugar</span> (.csv, .xlsx o .xls, hasta 10 MB)
        </label>
        <!--/* accept es solo una ayuda: la validación real es la del servidor. */-->
        <input type="file" name="archivo" accept=".csv,.xlsx,.xls" required th:id="|archivo-${codigo}|"
               th:aria-invalid="${rechazado} ? 'true' : null"
               th:aria-describedby="${rechazado} ? |error-${codigo}| : null">
        <button type="submit">Subir archivo</button>
    </form>
</section>
</body>
</html>
