spring.application.name=Coinciliador

# Subida de archivos (spec 001, RF-5 y RNF-1). El límite de negocio de 10 MB lo aplica @TamanoMaximo;
# estos 30 MB son un tope técnico. El umbral de disco supera al máximo para que nada se escriba en un temporal.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=31MB
# Si un archivo supera el tope, Tomcat tiene que leer el resto de la petición: si no, corta la conexión
# y el navegador no llega a ver el mensaje M2. Sin límite porque es una aplicación local de un solo usuario.
server.tomcat.max-swallow-size=-1
